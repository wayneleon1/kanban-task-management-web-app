@if (board(); as currentBoard) {
  @if (currentBoard.columns.length === 0) {
    <!-- ── Empty board state ── -->
    <div class="board-empty">
      <p class="board-empty__text text-heading-l">
        This board is empty. Create a new column to get started.
      </p>
      <app-button variant="primary-lg" (btnClick)="modalService.open('edit-board')">
        + Add New Column
      </app-button>
    </div>
  } @else {
    <!-- ── Board with columns ── -->
    <div class="board-columns">
      @for (column of currentBoard.columns; track column.id) {
        <app-board-column [column]="column" />
      }

      <!-- + New Column placeholder -->
      <div class="new-column-placeholder" (click)="modalService.open('edit-board')">
        <span class="new-column-placeholder__text text-heading-xl"> + New Column </span>
      </div>
    </div>
  }
} @else {
  <!-- ── Board not found ── -->
  <div class="board-empty">
    <p class="board-empty__text text-heading-l">Board not found.</p>
  </div>
}
