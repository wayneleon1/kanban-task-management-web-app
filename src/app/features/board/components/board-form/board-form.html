<app-modal>
  <div class="board-form">
    <h2 class="board-form__heading text-heading-l">{{ heading }}</h2>

    <form #boardForm="ngForm" (ngSubmit)="onSubmit(boardForm)" novalidate>
      <!-- ── Board Name ── -->
      <div class="form-field">
        <div class="form-field__label-row">
          <label class="form-label text-body-m" for="boardName">
            {{ nameLabel }}
          </label>
          @if (nameCtrl.invalid && nameCtrl.touched) {
            <span class="form-error-inline text-body-l">Can't be empty.</span>
          }
        </div>

        <input
          id="boardName"
          type="text"
          class="form-input text-body-l"
          [class.form-input--error]="nameCtrl.invalid && nameCtrl.touched"
          name="boardName"
          [(ngModel)]="boardNameModel"
          required
          minlength="2"
          maxlength="50"
          placeholder="e.g. Web Design"
          #nameCtrl="ngModel"
          autocomplete="off"
        />
      </div>

      <!-- ── Columns ── -->
      <div class="form-field">
        <label class="form-label text-body-m">{{ colLabel }}</label>

        <div class="column-list">
          @for (col of columnsModel; track col.id; let i = $index) {
            <div class="column-row">
              <div
                class="column-input-wrapper"
                [class.column-input-wrapper--error]="colRef.invalid && colRef.touched"
              >
                <input
                  type="text"
                  class="form-input column-input text-body-l"
                  [name]="'col_' + col.id"
                  [(ngModel)]="col.name"
                  required
                  minlength="1"
                  maxlength="50"
                  placeholder="e.g. Todo"
                  #colRef="ngModel"
                  autocomplete="off"
                />
                @if (colRef.invalid && colRef.touched) {
                  <span class="subtask-inline-error text-body-l">Can't be empty.</span>
                }
              </div>
              <button
                type="button"
                class="remove-btn"
                aria-label="Remove column"
                (click)="removeColumn(col.id)"
              >
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                  <path
                    d="M12.728 2.272L2.272 12.728M2.272 2.272l10.456 10.456"
                    stroke="#828FA3"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          }
        </div>

        <button type="button" class="btn btn--secondary btn--full-width" (click)="addColumn()">
          + Add New Column
        </button>
      </div>

      <!-- ── Submit ── -->
      <button type="submit" class="btn btn--primary-lg btn--full-width">
        {{ submitLabel }}
      </button>
    </form>

    <button type="button" class="btn btn--ghost" (click)="onCancel()">Cancel</button>
  </div>
</app-modal>
