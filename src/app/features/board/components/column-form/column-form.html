<app-modal>
  <div class="column-form">
    <h2 class="column-form__heading text-heading-l">{{ heading }}</h2>

    <form #columnForm="ngForm" (ngSubmit)="onSubmit(columnForm)" novalidate>
      <div class="form-field">
        <div class="form-field__label-row">
          <label class="form-label text-body-m" for="columnName">Column Name</label>
          @if (nameCtrl.invalid && nameCtrl.touched) {
            <span class="form-error-inline text-body-l">Can't be empty.</span>
          }
        </div>

        <input
          id="columnName"
          type="text"
          class="form-input text-body-l"
          [class.form-input--error]="nameCtrl.invalid && nameCtrl.touched"
          name="columnName"
          [(ngModel)]="nameModel"
          required
          minlength="1"
          maxlength="50"
          placeholder="e.g. Todo"
          #nameCtrl="ngModel"
          autocomplete="off"
        />
      </div>

      <button type="submit" class="btn btn--primary-lg btn--full-width">
        {{ submitLabel }}
      </button>
    </form>

    <button type="button" class="btn btn--ghost" (click)="onCancel()">Cancel</button>
  </div>
</app-modal>
