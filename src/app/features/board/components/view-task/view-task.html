<app-modal>
  @if (task(); as t) {
    <div class="view-task">
      <!-- ── Header ── -->
      <div class="view-task__header">
        <h2 class="view-task__title text-heading-l">{{ t.title }}</h2>

        <!-- Three-dot menu -->
        <div class="view-task__menu">
          <button
            class="view-task__menu-trigger"
            aria-label="Task options"
            (click)="menuOpen.update((v) => !v); $event.stopPropagation()"
          >
            <svg width="5" height="20" viewBox="0 0 5 20" fill="none">
              <circle cx="2.308" cy="2.308" r="2.308" fill="#828FA3" />
              <circle cx="2.308" cy="10" r="2.308" fill="#828FA3" />
              <circle cx="2.308" cy="17.692" r="2.308" fill="#828FA3" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="view-task__menu-dropdown">
              <button class="menu-option text-body-l" (click)="openEditTask()">Edit Task</button>
              <button
                class="menu-option menu-option--destructive text-body-l"
                (click)="openDeleteTask()"
              >
                Delete Task
              </button>
            </div>
          }
        </div>
      </div>

      <!-- ── Description ── -->
      @if (t.description) {
        <p class="view-task__description text-body-l">{{ t.description }}</p>
      }

      <!-- ── Subtasks ── -->
      @if (t.subtasks.length > 0) {
        <div class="view-task__subtasks">
          <h3 class="view-task__subtasks-heading text-heading-s">
            Subtasks ({{ completedCount() }} of {{ t.subtasks.length }})
          </h3>
          <div class="view-task__subtask-list">
            @for (subtask of t.subtasks; track subtask.id) {
              <app-checkbox
                [checked]="subtask.isCompleted"
                (checkedChange)="toggleSubtask(subtask.id)"
              >
                {{ subtask.title }}
              </app-checkbox>
            }
          </div>
        </div>
      }

      <!-- ── Current Status ── -->
      <div class="view-task__status">
        <app-dropdown
          label="Current Status"
          [options]="statusOptions()"
          [selected]="t.status"
          (selectedChange)="onStatusChange($event)"
        />
      </div>
    </div>
  }
</app-modal>
