<div class="board-column">
  <!-- ── Column Header ── -->
  <div class="column-header">
    <span class="column-header__dot" [style.background-color]="column().color"></span>
    <h2 class="column-header__title text-heading-s">
      {{ column().name }} ({{ column().tasks.length }})
    </h2>

    @if (canEdit()) {
      <div class="column-header__actions">
        <button
          class="column-header__move-btn"
          [disabled]="isFirst()"
          aria-label="Move column left"
          (click)="moveLeft.emit()"
        >
          <svg width="8" height="8" viewBox="0 0 10 7" fill="none">
            <path
              d="M9 3.5H1M1 3.5L4.5 7M1 3.5L4.5 0"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button
          class="column-header__move-btn"
          [disabled]="isLast()"
          aria-label="Move column right"
          (click)="moveRight.emit()"
        >
          <svg width="8" height="8" viewBox="0 0 10 7" fill="none">
            <path
              d="M1 3.5H9M9 3.5L5.5 0M9 3.5L5.5 7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div class="column-header__menu">
          <button
            class="column-header__menu-trigger"
            aria-label="Column options"
            (click)="toggleMenu()"
          >
            <svg width="4" height="16" viewBox="0 0 5 20" fill="none">
              <circle cx="2.308" cy="2.308" r="2.308" fill="#828FA3" />
              <circle cx="2.308" cy="10" r="2.308" fill="#828FA3" />
              <circle cx="2.308" cy="17.692" r="2.308" fill="#828FA3" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="column-header__menu-dropdown">
              <button class="column-menu-option text-body-l" (click)="openRename()">
                Rename Column
              </button>
              <button
                class="column-menu-option column-menu-option--destructive text-body-l"
                (click)="openDelete()"
              >
                Delete Column
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>

  <!-- ── Task Cards ── -->
  <div class="column-tasks">
    @for (task of column().tasks; track task.id) {
      <app-task-card [task]="task" />
    }
  </div>
</div>
