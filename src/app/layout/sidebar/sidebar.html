<aside class="sidebar">
  <!-- ── Logo ── -->
  <div class="sidebar__logo">
    <svg
      class="sidebar__logo-icon"
      width="24"
      height="25"
      viewBox="0 0 24 25"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <rect width="6" height="25" rx="2" fill="#635FC7" />
      <rect x="9" y="0" width="6" height="19" rx="2" fill="#635FC7" opacity="0.75" />
      <rect x="18" y="0" width="6" height="12" rx="2" fill="#635FC7" opacity="0.5" />
    </svg>
    <span class="sidebar__logo-text text-heading-xl">kanban</span>
  </div>

  <!-- ── Nav ── -->
  <nav class="sidebar__nav">
    <p class="sidebar__nav-heading text-heading-s">
      All Boards ({{ boardService.boards().length }})
    </p>

    <ul class="sidebar__board-list">
      @for (board of boardService.boards(); track board.id) {
        <li>
          <a
            class="sidebar__board-item"
            [routerLink]="['/boards', board.id]"
            routerLinkActive="sidebar__board-item--active"
          >
            <!-- Board icon -->
            <img src="assets/icon-board.svg" alt="" />
            <span class="text-heading-m">{{ board.name }}</span>
          </a>
        </li>
      }

      <!-- Create new board -->
      <li>
        <button class="sidebar__create-btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M0 2.889A2.889 2.889 0 0 1 2.889 0H13.11A2.889 2.889 0 0 1 16 2.889V13.11A2.889 2.889 0 0 1 13.111 16H2.89A2.889 2.889 0 0 1 0 13.111V2.89Zm1.333 5.555v4.667c0 .859.697 1.556 1.556 1.556h6.221V8.444H1.333Zm8.889 6.222H13.11c.859 0 1.556-.697 1.556-1.556V8.445h-4.444v6.222Zm4.444-7.556V2.89c0-.859-.697-1.556-1.556-1.556H2.89c-.859 0-1.556.697-1.556 1.556v4.222H14.666Z"
              fill="currentColor"
            />
          </svg>
          <span class="text-heading-m">+ Create New Board</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- ── Footer ── -->
  <div class="sidebar__footer">
    <!-- Theme Toggle -->
    <div class="sidebar__theme-toggle">
      <!-- Sun icon -->
      <img src="assets/icon-light-theme.svg" alt="icon-dark-theme" />

      <!-- Toggle switch -->
      <button
        class="theme-toggle__switch"
        [class.theme-toggle__switch--dark]="themeService.theme() === 'dark'"
        (click)="themeService.toggleTheme()"
        aria-label="Toggle theme"
      >
        <span class="theme-toggle__knob"></span>
      </button>

      <!-- Moon icon -->
      <img src="assets/icon-dark-theme.svg" alt="icon-dark-theme" />
    </div>

    <!-- Hide Sidebar -->
    <button class="sidebar__hide-btn text-heading-m" (click)="layoutService.hideSidebar()">
      <img src="assets/icon-hide-sidebar.svg" alt="icon-dark-theme" />
      Hide Sidebar
    </button>
  </div>
</aside>
