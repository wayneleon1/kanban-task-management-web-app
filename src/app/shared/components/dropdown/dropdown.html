<div class="dropdown-group">
  @if (label()) {
    <label class="dropdown-label text-body-m">{{ label() }}</label>
  }
  <div class="dropdown-wrapper" [class.dropdown-wrapper--open]="isOpen()">
    <!-- Trigger -->
    <button class="dropdown-trigger text-body-l" type="button" (click)="toggleDropdown()">
      <span>{{ getSelectedLabel() }}</span>
      <svg
        class="dropdown-arrow"
        width="10"
        height="7"
        viewBox="0 0 10 7"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M1 1L5 5L9 1" stroke="#635FC7" stroke-width="2" />
      </svg>
    </button>

    <!-- Options List -->
    @if (isOpen()) {
      <ul class="dropdown-list" role="listbox">
        @for (option of options(); track option.value) {
          <li
            class="dropdown-option text-body-l"
            [class.dropdown-option--selected]="option.value === selected()"
            role="option"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </li>
        }
      </ul>
    }
  </div>
</div>
